<div class="video-container mx-auto mb-4">
  <div class="ratio ratio-16x9 rounded shadow">
    {% if include.video_id %}
      {% comment %}
        Facade: load the iframe only after a click (assets/js/video-facade.js).
      {% endcomment %}
      <div
        class="video-facade"
        data-video-id="{{ include.video_id }}"
        data-title="{{ include.title | default: include.caption | default: 'Video' | escape }}"
      >
        <button
          type="button"
          class="video-facade__button"
          aria-label="Play video: {{ include.title | default: include.caption | default: 'Video' | escape }}"
        >
          <img
            class="video-facade__thumb"
            src="https://i.ytimg.com/vi/{{ include.video_id }}/hqdefault.jpg"
            alt=""
            width="480"
            height="360"
            loading="lazy"
            decoding="async"
          >
          <span class="video-facade__play" aria-hidden="true">
            <i class="fas fa-play"></i>
          </span>
        </button>
      </div>
    {% elsif include.vimeo_id %}
      <iframe
        src="https://player.vimeo.com/video/{{ include.vimeo_id }}"
        title="{{ include.title | default: 'Video' }}"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
      >
      </iframe>
    {% elsif include.src %}
      <video controls class="w-100 h-100 rounded">
        <source
          src="{{ include.src }}"
          type="{{ include.type | default: 'video/mp4' }}"
        >
        Your browser does not support the video tag.
      </video>
    {% endif %}
  </div>

  {% if include.caption %}
    <div class="text-center mt-2">
      <small class="text-muted">{{ include.caption }}</small>
    </div>
  {% endif %}
</div>

<style>
  .video-container {
    width: 100%;
    max-width: 48rem;
  }

  /* Ensure video fills container properly */
  .video-container iframe,
  .video-container video {
    border-radius: 0.375rem;
  }

  /* Mobile responsiveness */
  @media (max-width: 576px) {
    .video-container {
      margin-left: -0.5rem;
      margin-right: -0.5rem;
      max-width: calc(100vw - 1rem);
    }
  }
</style>
